name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + fmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # GUI (eframe/egui) + rfd 在 Linux 上的系统依赖
      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev libxkbcommon-dev libgtk-3-dev libgl1-mesa-dev

      # aws-lc-sys（russh 依赖）在 Windows 上构建需要 cmake + nasm
      - name: Install Windows build deps (aws-lc-sys)
        if: runner.os == 'Windows'
        run: choco install cmake nasm -y --no-progress

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build (debug)
        run: cargo build --locked

      - name: Unit tests
        run: cargo test --locked

      - name: Build (release)
        run: cargo build --release --locked

      - name: Acceptance tests (M1-M4)
        shell: bash
        run: bash tests/acceptance.sh

      - name: Cross-platform tests (CRLF / case / separators)
        shell: bash
        run: bash tests/cross_platform.sh

      - name: CLI smoke — i18n
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="./target/release/bcr.exe"; else BIN="./target/release/bcr"; fi
          "$BIN" --lang en diff Cargo.toml Cargo.lock || test $? -eq 1
          # compare 对不存在目录按设计返回 2；先捕获输出再 grep，避免 pipefail 误判失败
          OUT="$("$BIN" --lang de compare /nonexistent /nonexistent 2>&1 || true)"
          printf '%s' "$OUT" | grep -q "kein Verzeichnis"

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + fmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # GUI (eframe/egui) + rfd 在 Linux 上的系统依赖
      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libgtk-3-dev libgl1-mesa-dev

      # aws-lc-sys（russh 依赖）在 Windows 上构建需要 cmake + nasm。
      # P47-1：不再用 chocolatey（community.chocolatey.org 反复 499/504 超时）——
      # cmake 用 windows-latest 预装（C:\Program Files\CMake\bin），nasm 从官方直链 zip 下载解压。
      - name: Install Windows build deps (aws-lc-sys)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # windows-latest 预装 cmake（仅需加入 PATH）
          if (Test-Path 'C:\Program Files\CMake\bin') {
            echo 'C:\Program Files\CMake\bin' | Out-File -Append $env:GITHUB_PATH
          } elseif (Get-Command cmake -ErrorAction SilentlyContinue) {
            Write-Host 'cmake already on PATH'
          } else {
            throw 'cmake not found on windows-latest image'
          }
          # nasm：官方直链下载固定版本，绕开 chocolatey 超时
          $ver = '2.16.03'
          $url = "https://www.nasm.us/pub/nasm/releasebuilds/$ver/win64/nasm-$ver-win64.zip"
          $zip = Join-Path $env:TEMP 'nasm.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:TEMP 'nasm') -Force
          echo (Join-Path $env:TEMP "nasm\nasm-$ver") | Out-File -Append $env:GITHUB_PATH

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build (debug)
        run: cargo build --locked

      - name: Unit tests
        run: cargo test --locked

      - name: Build (release)
        run: cargo build --release --locked

      # GUI 冒烟：验证双击/启动不闪退（Windows 双击 exe 无参数等价场景）
      - name: Install xvfb (Linux GUI smoke)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb

      - name: GUI smoke test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="./target/release/bcr.exe"; else BIN="./target/release/bcr"; fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a bash tests/gui_smoke.sh "$BIN"
          else
            bash tests/gui_smoke.sh "$BIN"
          fi

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: bcr-${{ runner.os }}
          path: |
            target/release/bcr
            target/release/bcr.exe
          if-no-files-found: warn

      - name: Acceptance tests (M1-M4)
        shell: bash
        run: bash tests/acceptance.sh

      - name: Cross-platform tests (CRLF / case / separators)
        shell: bash
        run: bash tests/cross_platform.sh

      - name: CLI smoke — i18n
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="./target/release/bcr.exe"; else BIN="./target/release/bcr"; fi
          "$BIN" --lang en diff Cargo.toml Cargo.lock || test $? -eq 1
          # compare 对不存在目录按设计返回 2；先捕获输出再 grep，避免 pipefail 误判失败
          OUT="$("$BIN" --lang de compare /nonexistent /nonexistent 2>&1 || true)"
          printf '%s' "$OUT" | grep -q "kein Verzeichnis"

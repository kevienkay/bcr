name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: bash scripts/package-macos.sh
          - os: ubuntu-latest
            script: bash scripts/package-linux.sh
          - os: windows-latest
            script: powershell -File scripts/package-windows.ps1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      # GUI (eframe/egui) + rfd 在 Linux 上的系统依赖
      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev libxkbcommon-dev libgtk-3-dev libgl1-mesa-dev

      # aws-lc-sys（russh 依赖）在 Windows 上构建需要 cmake + nasm
      - name: Install Windows build deps (aws-lc-sys)
        if: runner.os == 'Windows'
        run: choco install cmake nasm -y --no-progress

      # WiX 工具链（msi，尽力而为）
      - name: Install WiX (Windows)
        if: runner.os == 'Windows'
        run: choco install wixtoolset -y --no-progress
        continue-on-error: true

      - name: Build (release)
        run: cargo build --release --locked

      - name: Package
        shell: bash
        run: |
          ${{ matrix.script }}

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  checksums:
    name: Checksums + Release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute SHA256SUMS
        run: |
          cd artifacts
          find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Upload SHA256SUMS
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: artifacts/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

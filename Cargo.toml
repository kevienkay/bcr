[package]
name = "bcr"
version = "0.1.0"
edition = "2021"
description = "Beyond Compare 风格的文件对比工具（Rust 实现）"

[dependencies]
clap = { version = "4", features = ["derive"] }
similar = "2"
walkdir = "2"
blake3 = "1"
globset = "0.4"
filetime = "0.2"
eframe = "0.36.0"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
zip = "8.6.0"
russh = "0.62.5"
russh-sftp = "2.4.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
encoding_rs = "0.8"
chardetng = "0.1"
syntect = { version = "5", default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "regex-fancy"] }
memmap2 = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
tar = "0.4"
flate2 = "1"
bzip2-rs = "0.1"
lzma-rs = "0.3"
sevenz-rust2 = "0.7"
suppaftp = "10.0.1"

[dev-dependencies]
tempfile = "3"

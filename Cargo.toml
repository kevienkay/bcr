[package]
name = "bcr"
version = "0.3.0"
edition = "2021"
description = "Beyond Compare 风格的文件对比工具（Rust 实现）"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
similar = "2"
walkdir = "2"
blake3 = "1"
globset = "0.4"
filetime = "0.2"
eframe = "0.36.1"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
zip = "8.6.0"
russh = "0.62.5"
russh-sftp = "2.4.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
encoding_rs = "0.8"
chardetng = "0.1"
syntect = { version = "5", default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "regex-fancy"] }
memmap2 = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
tar = "0.4"
flate2 = "1"
bzip2-rs = "0.1"
lzma-rs = "0.3"
sevenz-rust2 = "0.7"
suppaftp = { version = "10.0.1", features = ["deprecated", "rustls-aws-lc-rs"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
quick-xml = "0.37"
regex = "1"
rust-s3 = { version = "0.37.2", default-features = false, features = ["blocking", "with-tokio"] }
serde_json = "1.0.151"
arboard = "3"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
cab = "0.6.0"

# P58：muda 原生顶部菜单栏；仅 macOS/Windows 目标编译（Linux 无原生菜单，保留窗口内菜单栏）
[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.17"
[target.'cfg(target_os = "windows")'.dependencies]
muda = "0.17"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", default-features = false }
egui_kittest = { version = "0.36", features = ["snapshot", "wgpu", "eframe"] }

[[bench]]
name = "core"
harness = false
